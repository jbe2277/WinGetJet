name: WinGetJet
on:
  push:
    paths:
    - 'WinGetJet/**'
    - 'WinGetJet.UITests/**'
    - '.github/workflows/**'
jobs:
  Build:
    name: 🔨 Build
    runs-on: windows-latest
    steps:
    - name: 📥 Check-out
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10'

    - name: 🔐 Prepare certificate
      shell: pwsh
      env:
        MSStoreLocalCert64: ${{ secrets.MS_STORE_LOCAL_CERT64 }}
      run: |
        [IO.File]::WriteAllBytes((Join-Path $pwd "WinGetJet/WinGetJet" "MSStoreLocalCert.p12"), [Convert]::FromBase64String($env:MSStoreLocalCert64))

    - name: 📦 Create MSIX x64
      run: |
        cd WinGetJet/WinGetJet
        dotnet publish -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=true -p:PackageCertificateKeyFile=MSStoreLocalCert.p12 -p:AppxPackageDir=AppPackages/x64/

    - name: 📦 Create MSIX arm64
      run: |
        cd WinGetJet/WinGetJet
        dotnet publish -c Release -p:Platform=ARM64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=true -p:PackageCertificateKeyFile=MSStoreLocalCert.p12 -p:AppxPackageDir=AppPackages/arm64/

    - name: 📦 Upload MSIX
      uses: actions/upload-artifact@v6
      with:
        name: WinGetJet
        if-no-files-found: error
        path: |
          ./**/AppPackages/**/WinGetJet*.msix

  UITests:
    name: 🖥️ UI Tests
    runs-on: windows-2025
    needs: Build
    steps:
    - name: 📥 Check-out
      uses: actions/checkout@v6

    - name: 📦 Download Windows App
      uses: actions/download-artifact@v8
      with:
        name: WinGetJet
        path: ./WinGetJet

    - name: ⚙️ Install App
      shell: pwsh
      run: |
        $rootFolder = "./WinGetJet"
        $msixFile = Get-ChildItem -Path $rootFolder -Recurse -Filter *x64.msix | Select-Object -First 1
        Export-Certificate -Cert (Get-AuthenticodeSignature -FilePath $msixFile).SignerCertificate -FilePath ".\App.cer"
        Import-Certificate -FilePath ".\App.cer" -CertStoreLocation "Cert:\LocalMachine\TrustedPeople"
        Add-AppxPackage -Path $msixFile
        Get-AppxPackage -Name WinGetJet
      
    - name: 🖥️ UI Test
      run: |
        cd ./WinGetJet.UITests
        dotnet test --solution ./WinGetJet.UITests.slnx  --max-parallel-test-modules 1 --output Detailed

    - name: 📦 Upload UI Test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: UITests
        if-no-files-found: ignore
        path: |
          WinGetJet.UITests/TestResults/WinGetJet